plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jei"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Cloth Config, Cloth Math, Rei"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "Modrinth (Jade)"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ ships unobfuscated with official names: no mappings and no remapping,
    // so dependencies use the plain Java configurations instead of Loom's mod* ones.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "maven.modrinth:jade:${project.jade_version}"

    implementation("mezz.jei:jei-${project.jei_version}") {
        exclude(group: "mezz.jei")
    }

    runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-runtime-fabric:${rei_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}")
    compileOnly("me.shedaniel.cloth:basic-math:${cloth_math_version}")
    // REI's EntryStacks signatures reference Architectury's FluidStack, so javac needs it on the classpath
    compileOnly("dev.architectury:architectury-fabric:${architectury_version}")

    implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version_range": project.minecraft_version_range,
                "loader_version": project.loader_version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name
    }
}

def targetJavaVersion = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
